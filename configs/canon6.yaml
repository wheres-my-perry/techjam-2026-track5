# canon6 — the documented corpus/training contract for the final build.
#
# Thinh's rule (2026-08-31): keep everything involved in training in one config, then test
# against it automatically. Before this, the corpus definition was scattered across
# build_canon6.py (routing), get_ext.py / build_unseen6.py (sources) and run_canon6.sh
# (hyperparameters), so changing one thing silently broke another — holding ddim out fixed
# 'bedroom = fake' at 92.7:1 and simultaneously created it at 12.55:1 from the other side.
#
# tests/test_corpus_config.py checks selected rules against the BUILT manifests and builder
# constants. The builder still contains executable routing constants, so a rule change must update
# this file and the builder together, rebuild the manifests, and rerun the tests.

name: canon6

canonicalization:
  # --long first downsizes images whose native long side exceeds 320 (never upscales), then a
  # seeded random 176px crop makes every output the same size. Images at or below 320 retain native
  # pixels; larger inputs contain a downsampling trace. This is label-neutral only when every
  # native-size bucket is class-balanced (see invariants).
  long: 320
  crop: 176
  format: png

routing:
  # Held out of train/val entirely, keyed on GENERATOR NAME across every dataset — ddpm ships in
  # both WildFake and ArtiFact, and that is exactly how it leaked into canon2 train while
  # nominally held out of WildFake.
  holdout_generators: [ddpm, ddim]
  # ddim is held out for a second, independent reason: its content is bedroom 76.4% / church
  # 23.6% — 100% in two subjects — and it was 30% of the fake class. One-sided content may be
  # kept for TESTING but never used for TRAINING: it is both a shortcut and a competence limit
  # (a model trained on bedrooms detects bedrooms and nothing else).

  # Localized edits: a whole-image real/fake label is simply wrong for them.
  partial_edit_generators: [sid_tampered, lama, mat, generative_inpainting, palette]

  # Additional test-only generators (not held out for content reasons).
  test_only_generators: [deepfloyd_if]

  test_only_sources: []

  # Caps applied BEFORE the size-bucket balance, for sources that exist to balance a SUBJECT
  # rather than a size bucket. Holding ddim out does not remove bedrooms from the fake class:
  # ArtiFact's LSUN-trained GANs still emit ~1,400. This admits just enough real bedrooms to
  # match them without flooding the <=341 bucket.
  cap_source:
    lsun_bedroom: 3000
    # afhq_512 is 15,000 animal close-ups at native 512 and was the entire 342-512 real side:
    # 10 of 12 sampled reals were cat/dog faces while that bucket's fakes were diverse commercial
    # scenes. Size-balanced and content-disjoint -- passed bucket_audit AND content_audit, and was
    # visible only by looking at the images. flickr30k_web (everyday photos, native ~500x375)
    # carries the bucket instead.
    afhq_512: 4000
    # celebahq_1024 was 4,008 of 8,943 reals in the 769-1024 bucket and all faces, while that
    # bucket's fakes (midjourney_v6, flux_sid) have almost none -> "1024px face = real".
    celebahq_1024: 1500

splits:
  train_frac: 0.8
  val_frac: 0.1
  # Per class per native-size bucket in train.
  cap_bucket: 45000
  # EQUAL images per native-size bucket (Thinh, 2026-08-31). --long 320 leaves native sizes <=320
  # unscaled and modestly downsizes the 321-341 edge of the first bucket; 769-1024 is downscaled
  # 2.4-3.2x. Downscaling attenuates the high-frequency structure detection depends on. An unequal split
  # (canon6 was 65% <=341) trains the model mostly in one forensic regime. null = disabled.
  equal_bucket: null
  seed: 0

# Never used for training under any circumstances. The brief: "Do not use the following data
# during training." Enforced in code, not by convention.
forbidden_in_training:
  - dalle3                 # the judges' AI class
  - coco val2017           # the judges' real class; ships inside BOTH WildFake and ArtiFact

training:
  approach: pe_ft
  trunk: vit_pe_core_large_patch14_336.fb   # 316.1M params, under the brief's 2B limit
  epochs: 4
  batch: 48
  real_weight: 2
  crop_min: 112
  crop_max: 168
  # The shipped run uses two consistency views. Independently for each view, 40% take the stack
  # branch. That branch excludes center crop to preserve tensor shape and therefore draws 2..5
  # distinct size-preserving families even though the requested command-line maximum is 6.
  stack_aug: 0.4
  stack_max: 6

inference:
  spec: "vote(L=320)+pe_ft"   # downsize long side when >320; mean-vote at most 27 crop scores
  product_cutoff: 0.5
  evaluation_cutoff_rule: "state calibration per table; never imply set-specific cutoffs are the product cutoff"

# What the built manifests must satisfy. tests/test_corpus_config.py enforces these.
invariants:
  train_val_class_balance: true        # real == fake overall
  bucket_ratio_min: 0.8                # real:fake within every native-size bucket, train+val
  bucket_ratio_max: 1.25
  content_two_sided: true              # every SUBJECT appears on both sides of the label
  content_max_ratio: 8.0               # neither side of a subject may exceed this ratio
  no_holdout_in_train: true
  no_partial_edit_in_train: true
  no_forbidden_in_train: true
  no_file_in_two_splits: true
  max_metadata_auroc: 0.65             # shortcut_audit; blind to native size, see below
  max_canary_auroc: 0.65               # canary_audit; verified on the CHECKPOINT if exceeded

# Gates that must run on every new or changed manifest. audit_all runs the first five plus its own
# native-size and within-bucket-content checks. corpus_audit and the standalone whole-manifest
# content_audit must be invoked separately; see README.md. The old binding rule omitted
# content_audit, which is the gate that caught the bedroom bug.
gates:
  - label_provenance_audit   # labels re-derived from source, independent of the builder
  - bucket_audit             # class balance per native-size bucket
  - shortcut_audit           # metadata-only AUROC   [BLIND to native size after canonicalization]
  - size_audit               # per-class dimensions  [BLIND to native size after canonicalization]
  - canary_audit             # dumb pixel models
  - content_audit            # every subject on both sides
  - corpus_audit             # blank images, byte duplicates, cross-split leakage, near-duplicates
